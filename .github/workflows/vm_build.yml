name: VM Build

on:
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at 00:00 UTC
  workflow_dispatch: # Allows manual testing

jobs:
  build-vm:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Multipass & LXD
        run: |
          sudo snap install multipass
          # Standard GitHub runners don't support KVM
          # Switching to the LXD driver allows Multipass to run in a container-like mode
          sudo snap install lxd
          sudo lxd init --auto
          
          # Force LXD driver since GitHub Runners don't support nested KVM
          sudo multipass set local.driver=lxd

          # Fix networking
          sudo sysctl -w net.ipv4.ip_forward=1
          sudo iptables -P FORWARD ACCEPT
          sudo iptables -A FORWARD -o lxdbr0 -j ACCEPT
          sudo iptables -A FORWARD -i lxdbr0 -j ACCEPT
          
          # Wait for the daemon to settle
          sleep 20

      - name: Build VM (Non-Interactive)
        run: |
          VM_NAME="pandora-ci-$(date +%s)"
          echo "Building VM: $VM_NAME"
          # Use sudo -E to preserve environment variables like REPO_PATH
          echo 'y' | sudo -E make vm VM_NAME=$VM_NAME
        env:
          REPO_PATH: ${{ github.workspace }}

      - name: Verify Installation
        run: |
          sudo multipass list
          
          # Get the name of the VM we just created
          VM_ID=$(sudo multipass list --format csv | grep Running | cut -d, -f1 | head -n 1)
          if [ -z "$VM_ID" ]; then echo "No running VM found"; exit 1; fi
          
          echo "Verifying Pandora FMS Console on $VM_ID..."
      
          # Loop until the console responds
          SUCCESS=0
          for i in {1..15}; do
            # -L follows redirects, -s is silent, -I gets headers
            if sudo multipass exec $VM_ID -- curl -L -s -I http://localhost/pandora_console | grep -q "200 OK"; then
              echo "Success: Pandora FMS Console is reachable!"
              SUCCESS=1
              break
            fi
            echo "Attempt $i/15: Console not ready yet, sleeping 10s..."
            sleep 10
          done
      
          if [ $SUCCESS -ne 1 ]; then
            echo "Error: Console timed out."
            sudo multipass exec $VM_ID -- curl -L http://localhost/pandora_console | head -n 20
            exit 1
          fi
    
      - name: Cleanup VM
        if: always() # This runs even if the build fails
        run: |
          sudo multipass stop --all || true
          sudo multipass delete --all || true
          sudo multipass purge || true
