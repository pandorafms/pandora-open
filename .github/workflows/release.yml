name: Release

on:
  push:
    tags:
      - '*.*.*'

jobs:
  # First, run all tests via the main CI workflow to ensure the tagged commit is valid.
  verify:
    name: Verify Release Candidate
    uses: ./.github/workflows/ci.yml

  # If verification passes, build the release artifacts and publish.
  build-and-release:
    name: Build and Release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Multipass & LXD
        run: |
          sudo snap install multipass
          sudo snap install lxd
          sudo lxd init --auto
          sudo multipass set local.driver=lxd
          sudo sysctl -w net.ipv4.ip_forward=1
          sudo iptables -P FORWARD ACCEPT
          sudo iptables -A FORWARD -o lxdbr0 -j ACCEPT
          sudo iptables -A FORWARD -i lxdbr0 -j ACCEPT
          sleep 20

      - name: Build Release Artifacts
        run: |
          make all
          # Temporarily commented out to debug the makensis double free issue
          # sudo make agent_windows

      - name: Create GitHub Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.tar.gz build/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Cleanup Build VM
        if: always()
        run: |
          # The agent_windows target uses the default VM_NAME 'PandoraOpen' from the Makefile.
          # We pipe 'y' to non-interactively confirm the vm_clean prompt.
          echo 'y' | sudo make vm_clean
