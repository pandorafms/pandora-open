name: Daily VM Build

on:
  schedule:
    - cron: '0 3 * * *' # 3:00 AM UTC
  workflow_dispatch: # Allows manual testing

jobs:
  build-vm:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Multipass & LXD
        run: |
          sudo snap install multipass
          # Standard GitHub runners don't support KVM
          # Switching to the LXD driver allows Multipass to run in a container-like mode
          sudo snap install lxd
          sudo lxd init --auto
          
          # Force LXD driver since GitHub Runners don't support nested KVM
          sudo multipass set local.driver=lxd
          
          # Wait for the daemon to settle
          sleep 20

      - name: Build VM (Non-Interactive)
        run: |
          VM_NAME="pandora-ci-$(date +%s)"
          echo "Building VM: $VM_NAME"
          # Use sudo -E to preserve environment variables like REPO_PATH
          echo 'y' | sudo -E make vm VM_NAME=$VM_NAME
        env:
          REPO_PATH: ${{ github.workspace }}

      - name: Verify Installation
        run: |
          sudo multipass list
          
          # Get the name of the VM we just created
          VM_ID=$(sudo multipass list --format csv | grep Running | cut -d, -f1 | head -n 1)
          
          if [ -z "$VM_ID" ]; then 
            echo "No running VM found"
            exit 1
          fi
          
          # Check if the console is serving the 200 OK
          sudo multipass exec $VM_ID -- curl -s -I http://localhost/pandora_console | grep "200 OK"

      - name: Cleanup VM
        if: always() # This runs even if the build fails
        run: |
          sudo multipass stop --all || true
          sudo multipass delete --all || true
          sudo multipass purge || true
