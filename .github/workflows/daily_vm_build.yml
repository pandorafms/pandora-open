name: Daily VM Build

on:
  schedule:
    - cron: '0 3 * * *' # 3:00 AM UTC
  workflow_dispatch: # Allows manual testing

jobs:
  build-vm:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Multipass & LXD
        run: |
          sudo snap install multipass
          # Standard GitHub runners don't support KVM
          # Switching to the LXD driver allows Multipass to run in a container-like mode
          sudo snap install lxd
          sudo lxd init --auto
          sudo multipass set local.driver=lxd
          sudo usermod -aG multipass $USER
          # Wait for the daemon to settle
          sleep 10

      - name: Build VM (Non-Interactive)
        run: |
          VM_NAME="pandora-ci-$(date +%s)"
          echo "Building VM: $VM_NAME"
          sg multipass -c "echo 'y' | make vm VM_NAME=$VM_NAME"
        env:
          REPO_PATH: ${{ github.workspace }}

      - name: Verify Installation
        run: |
          sg multipass -c "multipass list"
          # Get the name of the VM we just created
          VM_ID=$(sg multipass -c "multipass list --format csv" | grep Running | cut -d, -f1 | head -n 1)
          if [ -z "$VM_ID" ]; then echo "No running VM found"; exit 1; fi
          sg multipass -c "multipass exec $VM_ID -- curl -s -I http://localhost/pandora_console" | grep "200 OK"

      - name: Cleanup VM
        if: always() # This runs even if the build fails
        run: |
          sg multipass -c "multipass stop --all"
          sg multipass -c "multipass delete --all"
          sg multipass -c "multipass purge"
